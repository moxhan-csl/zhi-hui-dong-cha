# 前端容器：托管 Vite 构建产物 + 反向代理 /api 到后端。
# 前端代码里 axios 用 baseURL='/api'、SSE 用 fetch('/api/chat/stream')，都是同源相对路径，
# 所以同源部署下前端不需要任何环境变量或重新编译。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传文档的体积上限；再大会在 nginx 层就 413，后端日志里看不到请求
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SSE 走 /api/，见下面 proxy_buffering off；这里不压缩 event-stream，打字机效果不受影响

    location / {
        # Vue Router history 模式：未知路径回落到 index.html
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        # Vite 产物带内容哈希，可长期缓存
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # 用变量 + Docker 内置 DNS 在请求时才解析后端：若写成静态 proxy_pass http://backend:8080，
        # 后端容器没起来时 nginx 会在启动阶段直接退出（host not found in upstream）。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:8080;
        # proxy_pass 带变量时不会自动附带 URI，必须自己拼 $request_uri
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 流式问答（SSE）必须关缓冲：否则 nginx 会把 token 攒满 4/8k 才下发，
        # 前端表现为“转圈很久然后整段出现”，首 Token 指标也随之失真。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 一次问答含检索 + 长回答；读超时太短会把进行中的流掐断
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 容器自身的存活探针，不经过后端
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
